<script>
(function(){
'use strict';
var canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
var VIEW_W=canvas.width,VIEW_H=canvas.height,WORLD=2800,EDGE=135,MAX_HULL=100,ROUTE_COUNT=7;
var ui={};
var st,keys={},mouse=false,last=performance.now(),peerPlayers={},playerId='p'+Math.random().toString(36).slice(2),mpChannel=null;
var SPECIAL_DOCKS={
Reedwatch:{kind:'resume',label:'Resume',icon:'scroll',url:window.SAILING_RESUME_URL||new URL('resume.html',location.href).href},
Northgate:{kind:'portfolio',label:'Portfolio',icon:'painting',url:window.SAILING_PORTFOLIO_URL||new URL('portfolio.html',location.href).href}
};
try{if(window.BroadcastChannel){mpChannel=new BroadcastChannel('against_wind_archipelago');mpChannel.onmessage=function(ev){var m=ev.data;if(!m||m.id===playerId)return;peerPlayers[m.id]={id:m.id,x:m.x,y:m.y,angle:m.angle,name:m.name||'Sailor',routeIndex:m.routeIndex||0,lastSeen:performance.now()/1000};};}}catch(e){mpChannel=null;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function lerp(a,b,t){return a+(b-a)*t;}
function wrap(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a;}
function vec(a){return{x:Math.cos(a),y:Math.sin(a)};}
function norm(v){var m=Math.hypot(v.x,v.y)||1;return{x:v.x/m,y:v.y/m};}
function d(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function turn(a,b,m){return a+clamp(wrap(b-a),-m,m);}
function angleBetween(a,b){return Math.abs(wrap(Math.atan2(a.y,a.x)-Math.atan2(b.y,b.x)));}
function randSeed(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function coastN(x){return EDGE+16*Math.sin(x/180)+8*Math.sin(x/72+1.7)+4*Math.sin(x/38);}
function coastS(x){return WORLD-EDGE+15*Math.sin(x/175+2.2)+8*Math.sin(x/80)+4*Math.sin(x/42+4);}
function coastW(y){return EDGE+16*Math.sin(y/175+.8)+8*Math.sin(y/75+2.5)+4*Math.sin(y/40);}
function coastE(y){return WORLD-EDGE+15*Math.sin(y/185+1.9)+8*Math.sin(y/78+3.1)+4*Math.sin(y/44);}
function sea(x,y,r){return x>r&&x<WORLD-r&&y>r&&y<WORLD-r;}
function msg(t,c){st.notes.unshift({text:t,color:c||'#fde68a',life:7});st.notes=st.notes.slice(0,6);}
function puff(x,y,n,c){for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,s=40+Math.random()*120;st.parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.25+Math.random()*.55,color:c||'#a5f3fc'});}}
function pushLand(o,r){var hit=false,n;if(o.x<r){o.x=r;hit=true;}if(o.x>WORLD-r){o.x=WORLD-r;hit=true;}if(o.y<r){o.y=r;hit=true;}if(o.y>WORLD-r){o.y=WORLD-r;hit=true;}for(var i=0;i<st.islands.length;i++){var isl=st.islands[i],dd=Math.hypot(o.x-isl.x,o.y-isl.y),md=isl.r+r;if(dd<md){n=norm({x:o.x-isl.x,y:o.y-isl.y});o.x=isl.x+n.x*md;o.y=isl.y+n.y*md;hit=true;}}for(i=0;i<st.towns.length;i++){var tw=st.towns[i],td=Math.hypot(o.x-tw.x,o.y-tw.y),tm=34+r;if(td<tm){n=norm({x:o.x-tw.x,y:o.y-tw.y});o.x=tw.x+n.x*tm;o.y=tw.y+n.y*tm;hit=true;}}return hit;}
function makeWorld(seed){var R=randSeed(seed),towns=[],islands=[],marks=[];for(var i=0;i<190;i++){var side=Math.floor(R()*4),x=0,y=0;if(side===0){x=R()*WORLD;y=R()*coastN(x)*.9;}if(side===1){x=R()*WORLD;y=coastS(x)+R()*(WORLD-coastS(x));}if(side===2){y=R()*WORLD;x=R()*coastW(y)*.9;}if(side===3){y=R()*WORLD;x=coastE(y)+R()*(WORLD-coastE(y));}marks.push({x:x,y:y,r:3+R()*9,type:R()<.72?'tree':'rock'});}var fixed=[{x:700,y:640,r:68,town:1,name:'Reedwatch'},{x:1880,y:760,r:76,town:1,name:'High Cay'},{x:2220,y:2020,r:82,town:1,name:'Cedar Isle'},{x:980,y:2090,r:58,town:0,name:'Mist Shoal'},{x:2485,y:1210,r:54,town:0,name:'Gull Rocks'}];for(i=0;i<fixed.length;i++){var f=fixed[i];islands.push({x:f.name==='Reedwatch'?f.x:f.x+(R()-.5)*80,y:f.name==='Reedwatch'?f.y:f.y+(R()-.5)*80,r:f.name==='Reedwatch'?f.r:f.r+(R()-.5)*28,town:f.town,name:f.name});}function dock(x,y,side,idx){if(idx!==null){var is=islands[idx],v=norm({x:x-is.x,y:y-is.y});return{x:is.x+v.x*(is.r+48),y:is.y+v.y*(is.r+48)};}if(side==='north')return{x:x,y:coastN(x)+60};if(side==='south')return{x:x,y:coastS(x)-60};if(side==='west')return{x:coastW(y)+60,y:y};return{x:coastE(y)-60,y:y};}function add(name,x,y,side,idx){var dk=dock(x,y,side,idx);towns.push({id:towns.length,name:name,x:x,y:y,side:side,islandIndex:idx,dockX:dk.x,dockY:dk.y,color:['#fde68a','#a7f3d0','#bfdbfe','#c4b5fd','#fca5a5','#86efac'][towns.length%6]});}['Northgate','Frost Quay','Amberwatch'].forEach(function(n,i){var x=600+i*760+(R()-.5)*110;add(n,x,coastN(x)-28,'north',null);});['Southmere','Low Harbor','Ash Dock'].forEach(function(n,i){var x=560+i*800+(R()-.5)*110;add(n,x,coastS(x)+28,'south',null);});['Dawnport','Old Ferry','Reedmouth'].forEach(function(n,i){var y=560+i*760+(R()-.5)*100;add(n,coastW(y)-28,y,'west',null);});['Eastlight','Crown Pier','Salt Abbey'].forEach(function(n,i){var y=560+i*760+(R()-.5)*100;add(n,coastE(y)+28,y,'east',null);});islands.forEach(function(is,idx){if(!is.town)return;var a=is.name==='Reedwatch'?Math.atan2(560-is.y,230-is.x):R()*Math.PI*2;add(is.name,is.x+Math.cos(a)*is.r*.45,is.y+Math.sin(a)*is.r*.45,'island',idx);});return{towns:towns,islands:islands,marks:marks};}
function route(towns,R){var start=towns.find(function(t){return t.name==='Dawnport';})||towns[0],reed=towns.find(function(t){return t.name==='Reedwatch';}),north=towns.find(function(t){return t.name==='Northgate';}),list=towns.filter(function(t){return t.id!==start.id&&(!reed||t.id!==reed.id)&&(!north||t.id!==north.id);});for(var i=list.length-1;i>0;i--){var j=Math.floor(R()*(i+1)),tmp=list[i];list[i]=list[j];list[j]=tmp;}var seq=[];if(reed)seq.push(reed.id);if(north&&(!reed||north.id!==reed.id))seq.push(north.id);return seq.concat(list).slice(0,ROUTE_COUNT);}
function target(){return st.routeIndex>=st.route.length?null:st.towns.find(function(t){return t.id===st.route[st.routeIndex];});}
function reset(){var seed=Math.floor(Math.random()*999999),R=randSeed(seed),w=makeWorld(seed),start=w.towns.find(function(t){return t.name==='Dawnport';})||w.towns[0];st={seed:seed,time:0,towns:w.towns,islands:w.islands,marks:w.marks,route:route(w.towns,R),routeIndex:0,pos:{x:start.dockX+45,y:start.dockY},headingAngle:0,sailPower:1,hull:100,speed:0,speedState:'Reach',windStrength:1,cam:{x:0,y:0},windSight:true,paused:false,finished:false,anchored:false,anchorTown:null,reedPromptDone:false,trail:[],parts:[],tracers:[],traders:[],monsters:[],fishSchools:[],dolphins:[],whales:[],weatherEvents:[],weatherTimer:8,weatherAlert:'Clear',notes:[],notifications:[],bounces:0,lastBounce:-99,message:'Open archipelago. Uploaded-template sailing physics; wind is circular gyres.',messageTimer:5,tick:0,multiplayerTimer:0};st.trail=[{x:st.pos.x,y:st.pos.y}];spawnTracers(650);spawnTraders(8);/* sea monsters disabled for now */spawnMonsters(0);spawnMarineLife();updateCamera(1);updateUI();}
function cores(t){return[{x:610+Math.sin(t*.26)*150,y:640+Math.cos(t*.22)*105,r:470,power:1.10,spin:1},{x:1500+Math.cos(t*.25)*180,y:720+Math.sin(t*.28)*130,r:520,power:1.08,spin:-1},{x:760+Math.sin(t*.24)*125,y:2180+Math.cos(t*.20)*110,r:520,power:1.02,spin:-1},{x:1420+Math.sin(t*.31)*180,y:1780+Math.cos(t*.24)*135,r:510,power:1.00,spin:1},{x:2180+Math.cos(t*.30)*165,y:1840+Math.sin(t*.23)*145,r:500,power:1.02,spin:-1},{x:2260+Math.sin(t*.22)*125,y:1160+Math.cos(t*.20)*125,r:430,power:.88,spin:1}];}
function windAt(x,y,t,future){var tt=t+(future||0),vx=0,vy=0;
// Cleaner circular gyre field. Removed the twitchy diagonal lane term that made the lower-left feel weird.
cores(tt).forEach(function(s){var dx=x-s.x,dy=y-s.y,rr=Math.hypot(dx,dy)+38,inf=Math.exp(-(dx*dx+dy*dy)/(s.r*s.r))*s.power;vx+=-dy/rr*inf*s.spin*1.85;vy+=dx/rr*inf*s.spin*1.85;});
vx+=Math.sin(y/260+tt*.18)*.08+Math.sin((x+y)/620-tt*.16)*.05;
vy+=Math.cos(x/280-tt*.16)*.08+Math.cos((x-y)/700+tt*.13)*.05;
st.weatherEvents.forEach(function(e){var dx=x-e.x,dy=y-e.y,d2=dx*dx+dy*dy,inf=Math.exp(-d2/(e.r*e.r))*(e.power||1);if(e.type==='squall'){vx+=Math.cos(e.angle)*inf*1.6;vy+=Math.sin(e.angle)*inf*1.6;}if(e.type==='spout'){var iv=1/(Math.sqrt(d2)+25);vx+=-dy*iv*inf*e.spin*2.2;vy+=dx*iv*inf*e.spin*2.2;}if(e.type==='fog'){vx+=Math.sin((x+e.angle*30)/100)*inf*.25;vy+=Math.cos((y-e.angle*30)/100)*inf*.25;}if(e.type==='storm'){vx+=Math.cos(e.angle+Math.PI/2)*inf*.75;vy+=Math.sin(e.angle+Math.PI/2)*inf*.75;}});var m=Math.hypot(vx,vy)||1;return{x:vx/m,y:vy/m,strength:clamp(.48+m*.50,.35,1.55)};}
function sailingPerformance(h,w){var deg=angleBetween(h,w)*180/Math.PI;if(deg>158)return{mult:.04,label:'In Irons',noSail:1,deg:deg};if(deg>132)return{mult:lerp(.28,.72,(158-deg)/26),label:'Close-Hauled',noSail:clamp((deg-132)/26,0,1),deg:deg};if(deg>70)return{mult:1.12+Math.sin((deg-70)/62*Math.PI)*.28,label:'Reach',noSail:0,deg:deg};if(deg>28)return{mult:.9+Math.sin((deg-28)/42*Math.PI)*.12,label:'Broad Reach',noSail:0,deg:deg};return{mult:.62,label:'Running',noSail:0,deg:deg};}
function spawnTracers(n){for(var i=0;i<n;i++){var x,y,k=0;do{x=Math.random()*WORLD;y=Math.random()*WORLD;k++;}while(!sea(x,y,10)&&k<60);st.tracers.push({x:x,y:y,px:x,py:y,life:10+Math.random()*18});}}
function updateTracers(dt){st.tracers.forEach(function(tr){tr.px=tr.x;tr.py=tr.y;var w=windAt(tr.x,tr.y,st.time);tr.x+=w.x*w.strength*28*dt;tr.y+=w.y*w.strength*28*dt;tr.life-=dt;if(tr.life<=0||!sea(tr.x,tr.y,5)){var x,y,k=0;do{x=st.cam.x+Math.random()*VIEW_W;y=st.cam.y+Math.random()*VIEW_H;k++;}while(!sea(x,y,8)&&k<30);tr.x=x;tr.y=y;tr.px=x;tr.py=y;tr.life=10+Math.random()*18;}});}
function spawnTraders(n){for(var i=0;i<n;i++){var a=st.towns[Math.floor(Math.random()*st.towns.length)],b=st.towns[Math.floor(Math.random()*st.towns.length)];if(a.id===b.id)b=st.towns[(b.id+2)%st.towns.length];st.traders.push({x:a.dockX,y:a.dockY,angle:Math.random()*Math.PI*2,targetId:b.id});}}
function spawnMonsters(n){for(var i=0;i<n;i++){var x,y,k=0;do{x=400+Math.random()*(WORLD-800);y=400+Math.random()*(WORLD-800);k++;}while(!sea(x,y,80)&&k<40);st.monsters.push({x:x,y:y,angle:Math.random()*Math.PI*2,dive:2+Math.random()*5,attack:0});}}
function chooseTrader(s){var b=st.towns[Math.floor(Math.random()*st.towns.length)];s.targetId=b.id;}
function updateTraders(dt){st.traders.forEach(function(s){var t=st.towns.find(function(v){return v.id===s.targetId;})||st.towns[0],dd=Math.hypot(t.dockX-s.x,t.dockY-s.y);if(dd<65){chooseTrader(s);return;}s.angle=turn(s.angle,Math.atan2(t.dockY-s.y,t.dockX-s.x),1.85*dt);var dir=vec(s.angle),w=windAt(s.x,s.y,st.time),p=sailingPerformance(dir,w),spd=(42+20*p.mult)*clamp(w.strength,.55,1.25);s.x+=(dir.x*spd+w.x*w.strength*7)*dt;s.y+=(dir.y*spd+w.y*w.strength*7)*dt;if(pushLand(s,22))chooseTrader(s);if(!st.anchored&&d(s,st.pos)<48){var away=norm({x:st.pos.x-s.x,y:st.pos.y-s.y});st.pos.x+=away.x*18;st.pos.y+=away.y*18;s.x-=away.x*14;s.y-=away.y*14;bounce('Trader traffic bumped your hull.','#a5f3fc');puff(st.pos.x,st.pos.y,16,'#a5f3fc');}});}
function updateMonsters(dt){st.monsters.forEach(function(m){m.dive=Math.max(0,m.dive-dt);m.attack=Math.max(0,m.attack-dt);var desired=m.dive>0?m.angle+Math.sin(st.time+m.x*.01)*.25:Math.atan2(st.pos.y-m.y,st.pos.x-m.x);m.angle=turn(m.angle,desired,(m.dive>0?.45:1.05)*dt);var dir=vec(m.angle),w=windAt(m.x,m.y,st.time),spd=m.dive>0?38:72;m.x+=(dir.x*spd+w.x*w.strength*12)*dt;m.y+=(dir.y*spd+w.y*w.strength*12)*dt;pushLand(m,58);if(m.dive<=0&&d(m,st.pos)<75&&m.attack<=0){var away=norm({x:st.pos.x-m.x,y:st.pos.y-m.y});st.pos.x+=away.x*34;st.pos.y+=away.y*34;st.hull=clamp(st.hull-4,0,MAX_HULL);m.dive=1.5;m.attack=2.6;bounce('Sea monster strike — bounced off line.','#93c5fd');puff(st.pos.x,st.pos.y,34,'#93c5fd');}});}
function randomOpenWaterPoint(margin){
margin=margin||120;
for(var tries=0;tries<220;tries++){
var x=margin+Math.random()*(WORLD-margin*2);
var y=margin+Math.random()*(WORLD-margin*2);
var ok=sea(x,y,margin*.25);
for(var i=0;i<st.islands.length&&ok;i++){var is=st.islands[i];if(Math.hypot(x-is.x,y-is.y)<is.r+110)ok=false;}
for(i=0;i<st.towns.length&&ok;i++){var t=st.towns[i];if(Math.hypot(x-t.x,y-t.y)<95)ok=false;}
if(ok)return{x:x,y:y};
}
return{x:margin+Math.random()*(WORLD-margin*2),y:margin+Math.random()*(WORLD-margin*2)};
}
function spawnMarineLife(){
st.fishSchools=[];st.dolphins=[];st.whales=[];
for(var i=0;i<22;i++){var p=randomOpenWaterPoint(90);st.fishSchools.push({x:p.x,y:p.y,px:p.x,py:p.y,angle:Math.random()*Math.PI*2,speed:10+Math.random()*16,count:5+Math.floor(Math.random()*8),spread:18+Math.random()*26,color:Math.random()<.34?'#fef3c7':Math.random()<.66?'#fb7185':'#a7f3d0',wobble:Math.random()*Math.PI*2});}
for(i=0;i<8;i++){p=randomOpenWaterPoint(130);st.dolphins.push({x:p.x,y:p.y,angle:Math.random()*Math.PI*2,speed:28+Math.random()*16,turn:Math.random()*Math.PI*2,leap:Math.random()*Math.PI*2,size:.78+Math.random()*.35});}
for(i=0;i<4;i++){p=randomOpenWaterPoint(180);st.whales.push({x:p.x,y:p.y,angle:Math.random()*Math.PI*2,speed:10+Math.random()*7,turn:Math.random()*Math.PI*2,size:.88+Math.random()*.32,hit:0});}
}
function updateMarineLife(dt){
for(var i=0;i<st.fishSchools.length;i++){var s=st.fishSchools[i];s.px=s.x;s.py=s.y;s.wobble+=dt*(.9+s.speed*.025);s.angle+=Math.sin(st.time*.45+s.wobble)*.18*dt;var w=windAt(s.x,s.y,st.time);s.x+=(Math.cos(s.angle)*s.speed+w.x*w.strength*4)*dt;s.y+=(Math.sin(s.angle)*s.speed+w.y*w.strength*4)*dt;if(!sea(s.x,s.y,20)){var p=randomOpenWaterPoint(90);s.x=p.x;s.y=p.y;s.px=p.x;s.py=p.y;}}
for(i=0;i<st.dolphins.length;i++){var d=st.dolphins[i];d.leap+=dt*3.4;d.angle+=Math.sin(st.time*.55+d.turn)*.32*dt;w=windAt(d.x,d.y,st.time);d.x+=(Math.cos(d.angle)*d.speed+w.x*w.strength*5)*dt;d.y+=(Math.sin(d.angle)*d.speed+w.y*w.strength*5)*dt;if(!sea(d.x,d.y,40)){d.angle+=Math.PI*.85;d.x=clamp(d.x,50,WORLD-50);d.y=clamp(d.y,50,WORLD-50);}}
for(i=0;i<st.whales.length;i++){var whale=st.whales[i];whale.hit=Math.max(0,whale.hit-dt);whale.angle+=Math.sin(st.time*.23+whale.turn)*.18*dt;w=windAt(whale.x,whale.y,st.time);whale.x+=(Math.cos(whale.angle)*whale.speed+w.x*w.strength*3)*dt;whale.y+=(Math.sin(whale.angle)*whale.speed+w.y*w.strength*3)*dt;if(!sea(whale.x,whale.y,70)){whale.angle+=Math.PI*.75;whale.x=clamp(whale.x,75,WORLD-75);whale.y=clamp(whale.y,75,WORLD-75);}for(var j=0;j<st.islands.length;j++){var is=st.islands[j],minD=is.r+78*whale.size,dd=Math.hypot(whale.x-is.x,whale.y-is.y)||1;if(dd<minD){whale.x=is.x+(whale.x-is.x)/dd*minD;whale.y=is.y+(whale.y-is.y)/dd*minD;whale.angle+=Math.PI*.72;}}for(j=0;j<st.towns.length;j++){var tw=st.towns[j],md=82*whale.size,td=Math.hypot(whale.x-tw.x,whale.y-tw.y)||1;if(td<md){whale.x=tw.x+(whale.x-tw.x)/td*md;whale.y=tw.y+(whale.y-tw.y)/td*md;whale.angle+=Math.PI*.6;}}var hitR=44*whale.size;if(Math.hypot(st.pos.x-whale.x,st.pos.y-whale.y)<hitR+26){var away=norm({x:st.pos.x-whale.x,y:st.pos.y-whale.y});st.pos.x=clamp(whale.x+away.x*(hitR+29),35,WORLD-35);st.pos.y=clamp(whale.y+away.y*(hitR+29),35,WORLD-35);whale.hit=.22;if(st.time-(st.lastWhaleHit||0)>.65){st.lastWhaleHit=st.time;st.hull=clamp(st.hull-1.5,0,MAX_HULL);bounce('You bumped a whale — huge, gentle, and very solid.','#93c5fd');puff(st.pos.x,st.pos.y,18,'#bfdbfe');}}}
}

function spawnWeather(){var x,y,k=0;do{x=300+Math.random()*(WORLD-600);y=300+Math.random()*(WORLD-600);k++;}while(!sea(x,y,50)&&k<40);var a=Math.random()*Math.PI*2,r=Math.random(),e;if(r<.32)e={type:'squall',short:'Squall',name:'Black Squall',x:x,y:y,r:260,life:18,maxLife:18,angle:a,vx:Math.cos(a)*24,vy:Math.sin(a)*24,power:2.2};else if(r<.58)e={type:'spout',short:'Spout',name:'Waterspout',x:x,y:y,r:225,life:16,maxLife:16,angle:a,vx:Math.cos(a)*18,vy:Math.sin(a)*18,power:2.6,spin:Math.random()<.5?-1:1};else if(r<.80)e={type:'fog',short:'Fog',name:'Fog Bank',x:x,y:y,r:310,life:22,maxLife:22,angle:a,vx:Math.cos(a)*16,vy:Math.sin(a)*16,power:.8};else e={type:'storm',short:'Storm',name:'Lightning Storm',x:x,y:y,r:280,life:20,maxLife:20,angle:a,vx:Math.cos(a)*20,vy:Math.sin(a)*20,power:1.5,strikeTimer:1.2};st.weatherEvents.push(e);st.weatherEvents=st.weatherEvents.slice(-4);st.weatherTimer=9+Math.random()*10;msg(e.name+' forming over the sea.','#c4b5fd');}

function update(dt){if(st.paused||st.finished)return;st.time+=dt;st.tick++;st.messageTimer=Math.max(0,st.messageTimer-dt);if(st.messageTimer<=0)st.message='Angle matters like the uploaded prototype. Circular gyres replace the old straight wind.';updateWeather(dt);updateTracers(dt);updateTraders(dt);updateMarineLife(dt);updateMultiplayer(dt);/* sea monsters disabled for now: updateMonsters(dt); */if(st.anchored){st.speed=0;st.speedState='Anchored';st.windStrength=windAt(st.pos.x,st.pos.y,st.time).strength;}else{if(keys.arrowleft||keys.a)st.headingAngle-=2.4*dt;if(keys.arrowright||keys.d)st.headingAngle+=2.4*dt;if(keys.arrowup||keys.w)st.sailPower=clamp(st.sailPower+1.4*dt,.25,1.2);if(keys.arrowdown||keys.s)st.sailPower=clamp(st.sailPower-1.8*dt,.15,1.2);var heading=vec(st.headingAngle),w=windAt(st.pos.x,st.pos.y,st.time),p=sailingPerformance(heading,w);st.speed=70*p.mult*w.strength*st.sailPower;st.speedState=p.label;st.windStrength=w.strength;st.pos.x+=(heading.x*st.speed+w.x*w.strength*9)*dt;st.pos.y+=(heading.y*st.speed+w.y*w.strength*9)*dt;if(pushLand(st.pos,31)){st.hull=clamp(st.hull-.8,0,MAX_HULL);bounce('Land collision — bounced off patterned coast or island.','#fca5a5');puff(st.pos.x,st.pos.y,18,'#fca5a5');}}if(st.tick%5===0){st.trail.push({x:st.pos.x,y:st.pos.y});if(st.trail.length>220)st.trail.shift();}st.parts.forEach(function(p){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.vx*=.96;p.vy*=.96;});st.parts=st.parts.filter(function(p){return p.life>0;});st.notes=st.notes.filter(function(n){n.life-=dt;return n.life>0;});st.hull=clamp(st.hull+dt*.15,0,MAX_HULL);completeWaypoint();updateCamera(dt);}

function drawTownIcon(t){var s=SPECIAL_DOCKS[t.name];if(!s)return;ctx.save();var bob=Math.sin(st.time*3+t.x*.01)*4,ix=t.x+54,iy=t.y-58+bob;if(s.icon==='scroll'){ctx.translate(ix,iy);ctx.shadowColor='rgba(15,23,42,.35)';ctx.shadowBlur=10;ctx.fillStyle='#f6e7bd';rr(-15,-14,30,28,8);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#d6b37a';ctx.beginPath();ctx.moveTo(-14,-10);ctx.quadraticCurveTo(-20,-2,-14,6);ctx.quadraticCurveTo(-18,13,-8,13);ctx.lineTo(8,13);ctx.quadraticCurveTo(18,13,14,6);ctx.quadraticCurveTo(20,-2,14,-10);ctx.fill();ctx.fillStyle='#fff7e6';rr(-10,-8,20,16,5);ctx.fill();ctx.strokeStyle='#b45309';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-8,-2);ctx.lineTo(8,-2);ctx.moveTo(-8,3);ctx.lineTo(8,3);ctx.stroke();ctx.strokeStyle='#8b5a2b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(8,-12);ctx.quadraticCurveTo(18,-18,20,-8);ctx.quadraticCurveTo(18,2,10,6);ctx.stroke();}else{ctx.translate(ix,iy);ctx.shadowColor='rgba(15,23,42,.35)';ctx.shadowBlur=10;ctx.fillStyle='#8b5e34';rr(-20,-16,40,32,6);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#d4a373';rr(-15,-11,30,22,4);ctx.fill();ctx.strokeStyle='#f8fafc';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-12,8);ctx.lineTo(-8,-1);ctx.lineTo(-2,5);ctx.lineTo(4,-6);ctx.lineTo(12,4);ctx.stroke();ctx.fillStyle='#fef3c7';ctx.beginPath();ctx.arc(8,-5,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#7c2d12';ctx.strokeStyle='#fbbf24';ctx.lineWidth=1.5;ctx.strokeRect(-19,-15,38,30);ctx.strokeRect(-14,-10,28,20);ctx.font='900 8px Georgia,serif';ctx.textAlign='center';ctx.fillText('portfolio',0,18);}if(Math.hypot(st.pos.x-t.dockX,st.pos.y-t.dockY)<110){ctx.fillStyle='rgba(2,6,23,.78)';rr(-52,22,104,20,7);ctx.fill();ctx.fillStyle='#f8fafc';ctx.font='800 10px system-ui';ctx.textAlign='center';ctx.fillText(s.label.toLowerCase(),0,36);ctx.fillText('open',0,48);}ctx.restore();}
function drawDockPrompt(t){if(t.name!=='Reedwatch'||st.reedPromptDone)return;var dDock=Math.hypot(st.pos.x-t.dockX,st.pos.y-t.dockY);var bob=Math.sin(st.time*6+t.x*.02)*7,px=t.x-134,py=t.y-118+bob,dPrompt=Math.hypot(st.pos.x-px,st.pos.y-py);if(dDock<150||dPrompt<90){st.reedPromptDone=true;return;}ctx.save();ctx.translate(px,py);ctx.fillStyle='rgba(2,6,23,.86)';rr(-72,-16,144,30,11);ctx.fill();ctx.strokeStyle='#fde68a';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#f8fafc';ctx.font='900 12px system-ui';ctx.textAlign='center';ctx.fillText('Press SPACE here',0,4);ctx.fillStyle='#fde68a';ctx.beginPath();ctx.moveTo(58,22);ctx.lineTo(66,10);ctx.lineTo(50,10);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(58,22);ctx.lineTo(t.dockX-px,t.dockY-py);ctx.strokeStyle='rgba(253,230,138,.75)';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();}
function drawWindSight(){ctx.save();cores(st.time).forEach(function(s){ctx.strokeStyle=s.spin>0?'rgba(216,180,254,.28)':'rgba(125,211,252,.26)';ctx.lineWidth=3;ctx.setLineDash([10,12]);ctx.beginPath();ctx.arc(s.x,s.y,s.r*.28,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(s.x,s.y,s.r*.5,0,Math.PI*2);ctx.stroke();});ctx.setLineDash([]);var sx=Math.floor(st.cam.x/90)*90-90,ex=st.cam.x+VIEW_W+120,sy=Math.floor(st.cam.y/80)*80-80,ey=st.cam.y+VIEW_H+120,i=0;for(var y=sy;y<=ey;y+=80)for(var x=sx;x<=ex;x+=90){drawArrow(x,y,windAt(x,y,st.time),false);if(i%3===0)drawArrow(x+26,y+26,windAt(x,y,st.time,6),true);i++;}ctx.restore();}
function drawArrow(x,y,w,ghost){var len=ghost?24:32,a=ghost?.25:.74,x2=x+w.x*len*w.strength,y2=y+w.y*len*w.strength;ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=ghost?'#ddd6fe':'#a5f3fc';ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=ghost?2:2.8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke();ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-w.x*10-w.y*6,y2-w.y*10+w.x*6);ctx.lineTo(x2-w.x*10+w.y*6,y2-w.y*10-w.x*6);ctx.closePath();ctx.fill();ctx.restore();}
function drawWeather(){ctx.save();st.weatherEvents.forEach(function(e){var age=e.life/e.maxLife,r=e.r*(1+Math.sin(st.time*5+e.x*.01)*.04);if(e.type==='squall'){ctx.fillStyle='rgba(15,23,42,'+(.45*age)+')';ctx.beginPath();ctx.arc(e.x,e.y,r,0,Math.PI*2);ctx.fill();}if(e.type==='spout'){ctx.strokeStyle='rgba(216,180,254,'+(.72*age)+')';ctx.lineWidth=4;ctx.setLineDash([10,8]);for(var k=0;k<4;k++){ctx.beginPath();ctx.arc(e.x,e.y,r*(.18+k*.16),e.angle+k,e.angle+k+Math.PI*1.4);ctx.stroke();}ctx.setLineDash([]);}if(e.type==='fog'){ctx.fillStyle='rgba(226,232,240,'+(.22*age)+')';ctx.beginPath();ctx.arc(e.x,e.y,r,0,Math.PI*2);ctx.fill();}if(e.type==='storm'){ctx.fillStyle='rgba(30,41,59,'+(.36*age)+')';ctx.beginPath();ctx.arc(e.x,e.y,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(253,224,71,'+(.65*age)+')';ctx.lineWidth=3;for(var i=0;i<5;i++){var aa=e.angle+i*1.25,px=e.x+Math.cos(aa)*r*.25,py=e.y+Math.sin(aa)*r*.25;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+Math.cos(aa+.5)*45,py+Math.sin(aa+.5)*45);ctx.lineTo(px+Math.cos(aa-.2)*80,py+Math.sin(aa-.2)*80);ctx.stroke();}}ctx.fillStyle='rgba(2,6,23,.72)';rr(e.x-54,e.y-r-28,108,22,8);ctx.fill();ctx.fillStyle='#f8fafc';ctx.font='800 12px system-ui';ctx.textAlign='center';ctx.fillText(e.name,e.x,e.y-r-13);});ctx.restore();}
function drawTrail(){if(st.trail.length<2)return;ctx.save();ctx.strokeStyle='rgba(248,250,252,.55)';ctx.lineWidth=3;ctx.setLineDash([8,10]);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(st.trail[0].x,st.trail[0].y);st.trail.slice(1).forEach(function(p){ctx.lineTo(p.x,p.y);});ctx.stroke();ctx.restore();}
function drawFriendlySailors(){st.traders.forEach(function(s){drawBoat(s.x,s.y,s.angle,'friendly','Reach');});}
function drawSeaMonsters(){st.monsters.forEach(function(m){ctx.save();ctx.globalAlpha=m.dive>0?.45:1;ctx.translate(m.x,m.y);ctx.rotate(m.angle+Math.PI/2);ctx.fillStyle='#172554';ctx.strokeStyle='#93c5fd';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,-60);ctx.bezierCurveTo(55,-18,48,48,0,82);ctx.bezierCurveTo(-48,48,-55,-18,0,-60);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();});}
function drawBoat(x,y,a,type,sailState){var angle=a+Math.PI/2,hull=type==='friendly'?'#164e63':'#5b341e',sail=type==='friendly'?'#67e8f9':'#f8fafc';if(type==='player'){if(sailState==='Reach')sail='#bef264';if(sailState==='Close-Hauled')sail='#fbbf24';if(sailState==='In Irons')sail='#f97316';}ctx.save();ctx.translate(x,y);ctx.rotate(angle);if(type==='player'){ctx.strokeStyle='rgba(253,230,138,.55)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-42);ctx.lineTo(0,-74);ctx.stroke();}ctx.fillStyle=hull;ctx.strokeStyle='#1f0f08';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,-26);ctx.bezierCurveTo(22,-3,16,24,0,33);ctx.bezierCurveTo(-16,24,-22,-3,0,-26);ctx.closePath();ctx.fill();ctx.stroke();ctx.strokeStyle='#f8fafc';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(0,21);ctx.stroke();ctx.fillStyle=sail;ctx.globalAlpha=.94;ctx.strokeStyle='#0f172a';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(2,-13);ctx.bezierCurveTo(27,1,22,17,2,18);ctx.closePath();ctx.fill();ctx.stroke();ctx.globalAlpha=1;ctx.fillStyle=type==='friendly'?'#dbeafe':'#facc15';ctx.beginPath();ctx.arc(0,0,4.5,0,Math.PI*2);ctx.fill();ctx.restore();}
function drawParticles(){ctx.save();st.parts.forEach(function(p){ctx.globalAlpha=clamp(p.life*2,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();});ctx.restore();}
function drawCompass(){var h=vec(st.headingAngle),w=windAt(st.pos.x,st.pos.y,st.time),p=sailingPerformance(h,w),cx=76,cy=VIEW_H-78;ctx.save();ctx.fillStyle='rgba(2,6,23,.72)';ctx.strokeStyle='rgba(165,243,252,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,48,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.strokeStyle='#a5f3fc';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+w.x*36,cy+w.y*36);ctx.stroke();ctx.strokeStyle='#fde68a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+h.x*31,cy+h.y*31);ctx.stroke();ctx.fillStyle='#f8fafc';ctx.font='900 11px system-ui';ctx.textAlign='center';ctx.fillText('WIND',cx,cy+64);ctx.fillStyle=st.finished?'#86efac':'#cffafe';ctx.font='900 13px system-ui';ctx.fillText(st.finished?'ROUTE COMPLETE':'HUD',cx,cy-62);ctx.fillStyle='#a5f3fc';ctx.font='11px system-ui';ctx.fillText(Math.round(p.deg)+'°',cx,cy-48);ctx.restore();}
function drawMiniMap(){var size=168,x=VIEW_W-size-18,y=VIEW_H-size-18;ctx.save();ctx.fillStyle='rgba(2,6,23,.78)';ctx.strokeStyle='rgba(165,243,252,.45)';ctx.lineWidth=2;rr(x,y,size,size,14);ctx.fill();ctx.stroke();function mapX(px){return x+px/WORLD*size;}function mapY(py){return y+py/WORLD*size;}st.islands.forEach(function(is){ctx.fillStyle='rgba(253,230,138,.78)';ctx.beginPath();ctx.arc(mapX(is.x),mapY(is.y),Math.max(2,is.r/WORLD*size),0,Math.PI*2);ctx.fill();});ctx.strokeStyle='rgba(253,230,138,.55)';ctx.lineWidth=2;ctx.setLineDash([5,5]);ctx.beginPath();var first=true;for(var i=st.routeIndex;i<st.route.length;i++){var t=st.towns.find(function(tt){return tt.id===st.route[i];});if(!t)continue;var px=mapX(t.dockX),py=mapY(t.dockY);if(first){ctx.moveTo(px,py);first=false;}else ctx.lineTo(px,py);}ctx.stroke();ctx.setLineDash([]);st.towns.forEach(function(t){ctx.fillStyle=t.id===st.route[st.routeIndex]?'#fde68a':'#67e8f9';ctx.beginPath();ctx.arc(mapX(t.dockX),mapY(t.dockY),t.id===st.route[st.routeIndex]?4:2.4,0,Math.PI*2);ctx.fill();});st.traders.forEach(function(s){ctx.fillStyle='#bfdbfe';ctx.beginPath();ctx.arc(mapX(s.x),mapY(s.y),2,0,Math.PI*2);ctx.fill();});if(st.whales){st.whales.forEach(function(w){ctx.fillStyle='#94a3b8';ctx.beginPath();ctx.arc(mapX(w.x),mapY(w.y),2.6,0,Math.PI*2);ctx.fill();});}Object.keys(peerPlayers).forEach(function(id){var p=peerPlayers[id];ctx.fillStyle='#f472b6';ctx.beginPath();ctx.arc(mapX(p.x),mapY(p.y),4,0,Math.PI*2);ctx.fill();});ctx.fillStyle='#fef3c7';ctx.strokeStyle='#0f172a';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(mapX(st.pos.x),mapY(st.pos.y),5.5,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='rgba(2,6,23,.72)';rr(x+8,y+8,74,19,7);ctx.fill();ctx.fillStyle='#a5f3fc';ctx.font='800 10px system-ui';ctx.textAlign='left';ctx.fillText('LOCAL MAP',x+14,y+21);ctx.restore();}
function updateUI(){}
function screen(sx,sy){var r=canvas.getBoundingClientRect();return{x:(sx-r.left)*(canvas.width/r.width)+st.cam.x,y:(sy-r.top)*(canvas.height/r.height)+st.cam.y};}
function aim(p){var dx=p.x-st.pos.x,dy=p.y-st.pos.y;if(Math.hypot(dx,dy)>4)st.headingAngle=Math.atan2(dy,dx);}
function specialDockAt(x,y){for(var i=0;i<st.towns.length;i++){var t=st.towns[i],s=SPECIAL_DOCKS[t.name],reach=72;if(!s)continue;if(t.islandIndex!==null&&st.islands[t.islandIndex])reach=st.islands[t.islandIndex].r+130;if(Math.hypot(x-t.dockX,y-t.dockY)<reach||Math.hypot(x-t.x,y-t.y)<reach*0.78)return t;}return null;}
function openSpecialDock(t){var s=SPECIAL_DOCKS[t.name];if(!s)return false;st.anchored=true;st.anchorTown=t.name;st.pos.x=t.dockX;st.pos.y=t.dockY;st.headingAngle=Math.atan2(t.dockY-t.y,t.dockX-t.x);st.speed=0;st.sailPower=0;st.message='Anchored at '+t.name+'. Opening '+s.label.toLowerCase()+'.';st.messageTimer=4;msg('Anchored at '+t.name+'.','#86efac');window.open(s.url,'_blank','noopener');return true;}
function handleSpace(){if(st.anchored)return true;var t=specialDockAt(st.pos.x,st.pos.y);if(t){openSpecialDock(t);return true;}return false;}
function loop(now){var dt=Math.min((now-last)/1000,.04);last=now;update(dt);draw();updateUI();requestAnimationFrame(loop);}
window.addEventListener('keydown',function(e){var k=e.key.toLowerCase();if(k===' '||e.code==='Space'){e.preventDefault();if(!e.repeat)handleSpace();return;}if(st.anchored&&k==='w'){st.anchored=false;st.anchorTown=null;st.sailPower=.6;st.speedState='Running';st.message='Anchor up.';st.messageTimer=2;msg('Anchor up.','#86efac');keys[k]=true;return;}keys[k]=true;if(k==='p')st.paused=!st.paused;if(k==='r')reset();});window.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false;});canvas.addEventListener('mousedown',function(e){mouse=true;aim(screen(e.clientX,e.clientY));});canvas.addEventListener('mousemove',function(e){if(mouse)aim(screen(e.clientX,e.clientY));});window.addEventListener('mouseup',function(){mouse=false;});
reset();requestAnimationFrame(loop);
})();
</script>
