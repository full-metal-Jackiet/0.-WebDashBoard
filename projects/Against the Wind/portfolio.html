<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portfolio</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#fef3c7,#fde68a 42%,#f8fafc 100%);font-family:ui-serif,Georgia,"Times New Roman",serif;color:#1f2937}
  .frame{width:min(820px,92vw);background:#6b4f2a;padding:18px;border-radius:28px;box-shadow:0 30px 80px rgba(15,23,42,.18);border:10px solid #8b5e34}
  .canvas{position:relative;min-height:480px;border-radius:16px;background:linear-gradient(180deg,#dbeafe 0%,#bfdbfe 45%,#86efac 46%,#4ade80 100%);overflow:hidden;border:4px solid #f8fafc}
  .mat{position:absolute;inset:26px;border:14px solid #f8fafc;border-radius:12px;box-shadow:inset 0 0 0 2px rgba(15,23,42,.08)}
  .title{position:absolute;left:50%;top:22px;transform:translateX(-50%);background:rgba(255,255,255,.82);padding:10px 18px;border-radius:999px;font-size:14px;letter-spacing:.2em;text-transform:uppercase;font-weight:800}
  .mountain{position:absolute;bottom:120px;width:0;height:0;border-left:120px solid transparent;border-right:120px solid transparent;border-bottom:160px solid #64748b;filter:drop-shadow(0 8px 0 rgba(15,23,42,.12))}
  .mountain.one{left:110px}
  .mountain.two{left:300px;border-bottom-color:#94a3b8;border-left-width:150px;border-right-width:150px;border-bottom-width:210px}
  .mountain.three{left:520px;border-bottom-color:#475569}
  .sun{position:absolute;right:90px;top:96px;width:84px;height:84px;border-radius:50%;background:#f59e0b;box-shadow:0 0 0 16px rgba(245,158,11,.22)}
  .water{position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(180deg,rgba(255,255,255,.0),rgba(255,255,255,.18));clip-path:polygon(0 35%,12% 40%,24% 33%,38% 42%,52% 34%,66% 43%,80% 36%,100% 42%,100% 100%,0 100%)}
  .caption{margin-top:14px;text-align:center;color:#3f2d18;font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
</style>
</head>
<body>
  <main>
    <section class="frame">
      <div class="canvas">
        <div class="mat"></div>
        <div class="title">Portfolio</div>
        <div class="sun"></div>
        <div class="mountain one"></div>
        <div class="mountain two"></div>
        <div class="mountain three"></div>
        <div class="water"></div>
      </div>
    </section>
    <div class="caption">Classical portfolio painting</div>
  </main>
</body>
</html>
